name: Test Library

on:
  push:
    branches: [ main, develop, add_dir_pin ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  arduino-cli:
    name: Arduino CLI Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        board:
          - fqbn: "arduino:avr:uno"
            platform: "arduino:avr"
          - fqbn: "arduino:avr:mega"
            platform: "arduino:avr"
          - fqbn: "esp32:esp32:esp32"
            platform: "esp32:esp32"
            index_url: "https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json"

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v1

    - name: Install platform
      run: |
        arduino-cli core update-index
        if [ "${{ matrix.board.index_url }}" != "" ]; then
          arduino-cli core update-index --additional-urls "${{ matrix.board.index_url }}"
        fi
        arduino-cli core install ${{ matrix.board.platform }}
      shell: bash

    - name: Install library dependencies
      run: arduino-cli lib install "Arduino"
      shell: bash
      continue-on-error: true

    - name: Create library symlink (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir -p $HOME/Arduino/libraries
        ln -s $GITHUB_WORKSPACE $HOME/Arduino/libraries/SimpleModbusSlave

    - name: Create library symlink (Windows)
      if: runner.os == 'Windows'
      run: |
        New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\Documents\Arduino\libraries"
        cmd /c mklink /D "$env:USERPROFILE\Documents\Arduino\libraries\SimpleModbusSlave" "$env:GITHUB_WORKSPACE"
      shell: pwsh

    - name: Compile SimpleModbusSlave example
      run: |
        arduino-cli compile --fqbn ${{ matrix.board.fqbn }} examples/SimpleModbusSlave/SimpleModbusSlave.ino --verbose
      shell: bash

    - name: Compile TestCRC16 example
      run: |
        arduino-cli compile --fqbn ${{ matrix.board.fqbn }} examples/TestCRC16/TestCRC16.ino --verbose
      shell: bash

  platformio:
    name: PlatformIO Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        board:
          - "uno"
          - "megaatmega2560"
          - "esp32dev"
          - "nodemcuv2"

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Create test project
      shell: bash
      run: |
        mkdir pio-test
        cd pio-test
        pio project init --board ${{ matrix.board }}

    - name: Copy library to test project
      shell: bash
      run: |
        mkdir -p pio-test/lib/SimpleModbusSlave
        # Copy all library files
        cp *.h *.cpp library.json pio-test/lib/SimpleModbusSlave/ 2>/dev/null || true
        # Copy examples if they exist
        if [ -d "examples" ]; then
          cp -r examples pio-test/lib/SimpleModbusSlave/ 2>/dev/null || true
        fi

    - name: Create test source file
      shell: bash
      run: |
        cat > pio-test/src/main.cpp << 'EOF'
        #include <Arduino.h>
        #include <SimpleModbusSlave.h>
        
        SimpleModbusSlave slave(1, 2);
        uint16_t regs[10];
        
        void setup() {
            regs[0] = 0x1234;
            slave.setup(115200);
        }
        
        void loop() {
            slave.loop(regs, sizeof(regs) / sizeof(regs[0]));
        }
        EOF

    - name: Build with PlatformIO
      run: |
        cd pio-test
        pio run

    - name: Test library examples (if available)
      shell: bash
      run: |
        cd pio-test
        # Test SimpleModbusSlave example if it exists
        if [ -f "../examples/SimpleModbusSlave/SimpleModbusSlave.ino" ]; then
          echo "Testing SimpleModbusSlave example..."
          # Create a modified version of the example
          cat > src/example_test.cpp << 'EOF'
        #include <Arduino.h>
        #include <SimpleModbusSlave.h>
        
        SimpleModbusSlave slave(1);
        uint16_t regs[10];
        
        void setup() {
            regs[0] = 0x1234;
            slave.setup(115200);
        }
        
        void loop() {
            slave.loop(regs, sizeof(regs) / sizeof(regs[0]));
        }
        EOF
          # Rename to main.cpp and build
          mv src/example_test.cpp src/main.cpp
          pio run || echo "Example test failed"
        fi
      continue-on-error: true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Create test project for unit tests
      run: |
        mkdir unit-test-project
        cd unit-test-project
        pio project init --board uno
        
        # Create platformio.ini with test configuration
        cat > platformio.ini << 'EOF'
        [env:uno]
        platform = atmelavr
        board = uno
        framework = arduino
        test_framework = unity
        lib_deps = 
            unity
        EOF

    - name: Copy library and tests
      shell: bash
      run: |
        cd unit-test-project
        mkdir -p lib/SimpleModbusSlave
        # Copy library files with error handling
        cp ../*.h ../*.cpp ../library.json lib/SimpleModbusSlave/ 2>/dev/null || true
        # Copy test files if they exist
        if [ -d "../test" ]; then
          cp -r ../test . 2>/dev/null || true
        fi

    - name: Run unit tests
      run: |
        cd unit-test-project
        pio test
      continue-on-error: true

  library-validation:
    name: Library Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v1

    - name: Validate library properties
      run: |
        # Check if library.properties exists and has required fields
        if [ ! -f "library.properties" ]; then
          echo "ERROR: library.properties not found"
          exit 1
        fi
        
        # Check required fields
        grep -q "name=" library.properties || (echo "ERROR: name field missing" && exit 1)
        grep -q "version=" library.properties || (echo "ERROR: version field missing" && exit 1)
        grep -q "author=" library.properties || (echo "ERROR: author field missing" && exit 1)
        grep -q "sentence=" library.properties || (echo "ERROR: sentence field missing" && exit 1)
        
        echo "✅ library.properties validation passed"

    - name: Check library structure
      run: |
        # Check for required files
        [ -f "SimpleModbusSlave.h" ] || (echo "ERROR: Main header file missing" && exit 1)
        [ -f "SimpleModbusSlave.cpp" ] || (echo "ERROR: Main source file missing" && exit 1)
        [ -d "examples" ] || (echo "ERROR: examples directory missing" && exit 1)
        
        echo "✅ Library structure validation passed"

    - name: Lint library with Arduino CLI
      run: |
        arduino-cli lib install --git-url https://github.com/${{ github.repository }}.git || true
        echo "✅ Library installation test passed"

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check README
      run: |
        if [ ! -f "README.md" ]; then
          echo "ERROR: README.md not found"
          exit 1
        fi
        
        # Check if README has basic content
        grep -q -i "modbus" README.md || (echo "ERROR: README doesn't mention Modbus" && exit 1)
        grep -q -i "example" README.md || (echo "ERROR: README doesn't contain examples" && exit 1)
        
        echo "✅ README validation passed"

    - name: Check examples documentation
      run: |
        # Check if examples have .ino files
        find examples -name "*.ino" | grep -q . || (echo "ERROR: No .ino files found in examples" && exit 1)
        
        echo "✅ Examples validation passed"

  release-check:
    name: Release Readiness
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [arduino-cli, platformio, library-validation, documentation]
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check version consistency
      run: |
        # Extract version from library.properties
        LIB_VERSION=$(grep "version=" library.properties | cut -d'=' -f2)
        echo "Library version: $LIB_VERSION"
        
        # Check if it's a valid semantic version
        if ! echo "$LIB_VERSION" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' > /dev/null; then
          echo "ERROR: Invalid version format in library.properties"
          exit 1
        fi
        
        echo "✅ Version format validation passed"

    - name: Generate release summary
      run: |
        echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Arduino CLI tests passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ PlatformIO tests passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Library validation passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Documentation checks passed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Library is ready for release! 🚀" >> $GITHUB_STEP_SUMMARY

  publish-platformio:
    name: Publish to PlatformIO Registry
    runs-on: ubuntu-latest
    needs: [arduino-cli, platformio, unit-tests, library-validation, documentation, release-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for version comparison

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Check if version is newer than published
      id: version-check
      run: |
        # Get current version from library.json
        CURRENT_VERSION=$(grep '"version":' library.json | sed 's/.*"version": *"\([^"]*\)".*/\1/')
        echo "Current version: $CURRENT_VERSION"
        
        # Try to get published version (this will fail if library is not published yet)
        PUBLISHED_VERSION=""
        if pio lib show "SimpleModbusSlave" > /dev/null 2>&1; then
          PUBLISHED_VERSION=$(pio lib show "SimpleModbusSlave" | grep "Version:" | awk '{print $2}' | head -1)
          echo "Published version: $PUBLISHED_VERSION"
        else
          echo "Library not yet published to PlatformIO Registry"
          PUBLISHED_VERSION="0.0.0"
        fi
        
        # Compare versions using sort -V (version sort)
        if printf '%s\n%s\n' "$PUBLISHED_VERSION" "$CURRENT_VERSION" | sort -V -C; then
          if [ "$CURRENT_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "✅ Current version ($CURRENT_VERSION) is newer than published ($PUBLISHED_VERSION)"
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "published_version=$PUBLISHED_VERSION" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Current version ($CURRENT_VERSION) is same as published ($PUBLISHED_VERSION)"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "❌ Current version ($CURRENT_VERSION) is older than published ($PUBLISHED_VERSION)"
          echo "should_publish=false" >> $GITHUB_OUTPUT
        fi

    - name: Validate library for publishing
      if: steps.version-check.outputs.should_publish == 'true'
      run: |
        # Check that required files exist
        if [ ! -f "library.json" ]; then
          echo "ERROR: library.json not found"
          exit 1
        fi
        
        # Validate library.json structure
        echo "Validating library.json structure..."
        python3 -c "import json; data=json.load(open('library.json')); fields=['name','version','description','keywords','authors']; missing=[f for f in fields if f not in data]; exit(1) if missing else print('✅ library.json validation passed')"

    - name: Publish to PlatformIO Registry
      if: steps.version-check.outputs.should_publish == 'true'
      env:
        PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}
      run: |
        echo "Publishing SimpleModbusSlave v${{ steps.version-check.outputs.current_version }} to PlatformIO Registry..."
        
        if [ -z "$PLATFORMIO_AUTH_TOKEN" ]; then
          echo "❌ PLATFORMIO_AUTH_TOKEN secret not found!"
          echo "Please add your PlatformIO account token to GitHub repository secrets"
          echo "Get your token from: https://registry.platformio.org/token"
          exit 1
        fi
        
        # Publish the library
        pio package publish --type=library
        
        echo "✅ Successfully published to PlatformIO Registry!"

    - name: Create GitHub Release
      if: steps.version-check.outputs.should_publish == 'true'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.version-check.outputs.current_version }}
        release_name: Release v${{ steps.version-check.outputs.current_version }}
        body: |
          ## SimpleModbusSlave v${{ steps.version-check.outputs.current_version }}
          
          ### 🚀 What's New
          - Automatic release from main branch
          - All tests passed ✅
          - Published to PlatformIO Registry
          
          ### 📦 Installation
          
          **PlatformIO:**
          ```bash
          pio lib install "SimpleModbusSlave@${{ steps.version-check.outputs.current_version }}"
          ```
          
          **Arduino IDE:**
          Use Library Manager or download from GitHub releases.
          
          ### 🔗 Links
          - [PlatformIO Registry](https://registry.platformio.org/libraries/kolod/SimpleModbusSlave)
          - [GitHub Repository](https://github.com/kolod/Arduino-Simple-Modbus-Slave)
          
          ---
          *This release was automatically created by GitHub Actions*
        draft: false
        prerelease: false

    - name: Update release summary
      if: steps.version-check.outputs.should_publish == 'true'
      run: |
        echo "## 🎉 Library Published Successfully!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Version Information" >> $GITHUB_STEP_SUMMARY
        echo "- **Published Version:** v${{ steps.version-check.outputs.current_version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Previous Version:** v${{ steps.version-check.outputs.published_version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Installation Commands" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo "# PlatformIO" >> $GITHUB_STEP_SUMMARY
        echo "pio lib install \"SimpleModbusSlave@${{ steps.version-check.outputs.current_version }}\"" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "# Arduino CLI" >> $GITHUB_STEP_SUMMARY
        echo "arduino-cli lib install \"SimpleModbusSlave@${{ steps.version-check.outputs.current_version }}\"" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔗 Registry Links" >> $GITHUB_STEP_SUMMARY
        echo "- [PlatformIO Registry](https://registry.platformio.org/libraries/kolod/SimpleModbusSlave)" >> $GITHUB_STEP_SUMMARY
        echo "- [Arduino Library Manager](https://www.arduinolibraries.info/libraries/simple-modbus-slave)" >> $GITHUB_STEP_SUMMARY

    - name: Skip publishing summary
      if: steps.version-check.outputs.should_publish == 'false'
      run: |
        echo "## ℹ️ Publishing Skipped" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Reason:** Version not newer than published version" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Current Version:** v${{ steps.version-check.outputs.current_version || 'unknown' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Published Version:** v${{ steps.version-check.outputs.published_version || 'unknown' }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "To publish a new version:" >> $GITHUB_STEP_SUMMARY
        echo "1. Update version in \`library.json\` and \`library.properties\`" >> $GITHUB_STEP_SUMMARY
        echo "2. Commit and push to main branch" >> $GITHUB_STEP_SUMMARY